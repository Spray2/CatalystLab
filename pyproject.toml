[project]
name = "catalystlab"
version = "0.1.0"
description = "Event-driven research framework per retail trading post-cost"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Prometeus" }]
license = { text = "Proprietary" }

dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "yfinance>=0.2.40",
    "statsmodels>=0.14",
    "pyarrow>=16.0",
    "jinja2>=3.1",
    "exchange-calendars>=4.13.2",
    "lxml>=6.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5.0",
]

[project.scripts]
catalystlab = "catalystlab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catalystlab"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src/catalystlab"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
